<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>SSV Field Tracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        var(--tg-theme-bg-color, #ffffff);
      --bg2:       var(--tg-theme-secondary-bg-color, #f4f4f5);
      --text:      var(--tg-theme-text-color, #111111);
      --hint:      var(--tg-theme-hint-color, #888888);
      --link:      var(--tg-theme-link-color, #2481cc);
      --btn:       var(--tg-theme-button-color, #2481cc);
      --btn-text:  var(--tg-theme-button-text-color, #ffffff);
      --accent:    #2481cc;
      --red:       #e53935;
      --green:     #43a047;
      --orange:    #fb8c00;
      --radius:    10px;
      --font:      -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }

    /* ── Screens ── */
    .screen { display: none; padding: 16px; animation: fadeIn .15s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--bg2);
      position: sticky; top: 0; background: var(--bg); z-index: 10;
    }
    .header h1 { font-size: 16px; font-weight: 700; flex: 1; }
    .back-btn {
      background: none; border: none; color: var(--link);
      font-size: 14px; cursor: pointer; padding: 4px 0;
    }

    /* ── Search Screen ── */
    .search-wrap { margin-top: 20px; }
    .search-input-row {
      display: flex; gap: 8px;
    }
    .search-input {
      flex: 1;
      border: 1.5px solid var(--bg2);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 15px;
      background: var(--bg2);
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--accent); background: var(--bg); }
    .btn {
      background: var(--btn);
      color: var(--btn-text);
      border: none; border-radius: var(--radius);
      padding: 12px 18px; font-size: 14px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .btn:active { opacity: .8; }
    .btn-outline {
      background: none; border: 1.5px solid var(--btn);
      color: var(--btn);
    }
    .btn-block { width: 100%; margin-top: 10px; padding: 14px; }

    /* Search results list */
    .result-list { margin-top: 14px; }
    .result-item {
      background: var(--bg2);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .result-item:active { opacity: .7; }
    .result-item .site-id { font-weight: 700; font-size: 14px; color: var(--accent); }
    .result-item .meta { font-size: 12px; color: var(--hint); margin-top: 3px; }

    /* ── Dashboard Screen ── */
    .dash-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-top: 16px;
    }
    .stat-card {
      background: var(--bg2); border-radius: var(--radius);
      padding: 16px 12px; text-align: center;
    }
    .stat-card .num {
      font-size: 28px; font-weight: 800; line-height: 1;
    }
    .stat-card .label { font-size: 11px; color: var(--hint); margin-top: 5px; }
    .stat-card.green .num { color: var(--green); }
    .stat-card.blue  .num { color: var(--accent); }
    .stat-card.orange .num { color: var(--orange); }
    .stat-card.red   .num { color: var(--red); }

    /* ── Site Detail Screen ── */
    .section-block {
      background: var(--bg2); border-radius: var(--radius);
      margin-top: 12px; overflow: hidden;
    }
    .section-title {
      font-size: 11px; font-weight: 700; letter-spacing: .8px;
      color: var(--hint); padding: 10px 14px 6px;
      text-transform: uppercase; border-bottom: 1px solid rgba(0,0,0,.06);
    }
    .field-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 14px; border-bottom: 1px solid rgba(0,0,0,.04);
    }
    .field-row:last-child { border-bottom: none; }
    .field-label { font-size: 13px; color: var(--hint); }
    .field-value { font-size: 13px; font-weight: 600; text-align: right; max-width: 55%; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }
    .badge-yes   { background: #e8f5e9; color: #2e7d32; }
    .badge-no    { background: #fce4ec; color: #c62828; }
    .badge-blank { background: var(--bg2); color: var(--hint); }

    /* ── Loading & Error ── */
    .loading {
      text-align: center; padding: 40px 20px;
      color: var(--hint); font-size: 14px;
    }
    .loading .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--bg2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: #fff3f3; border: 1px solid #ffcdd2;
      border-radius: var(--radius); padding: 12px 14px;
      color: var(--red); font-size: 13px; margin-top: 12px;
    }
    .empty-msg {
      text-align: center; padding: 32px 20px;
      color: var(--hint); font-size: 14px;
    }

    /* ── Form Elements ── */
    .form-section { margin-top: 12px; }
    .form-section-title {
      font-size: 11px; font-weight: 700; letter-spacing: .8px;
      color: var(--hint); text-transform: uppercase;
      padding: 10px 0 6px;
    }
    .form-group {
      background: var(--bg2); border-radius: var(--radius);
      overflow: hidden; margin-bottom: 2px;
    }
    .form-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid rgba(0,0,0,.05);
      gap: 10px;
    }
    .form-row:last-child { border-bottom: none; }
    .form-row label { font-size: 13px; color: var(--text); flex-shrink: 0; max-width: 48%; }
    .form-row label.disabled { color: var(--hint); }
    .form-select, .form-input {
      flex: 1; background: var(--bg); border: 1.5px solid transparent;
      border-radius: 6px; padding: 7px 10px; font-size: 13px;
      color: var(--text); outline: none; text-align: right;
      transition: border-color .2s;
    }
    .form-select:focus, .form-input:focus { border-color: var(--accent); }
    .form-select:disabled, .form-input:disabled {
      opacity: .4; cursor: not-allowed; background: var(--bg2);
    }

    /* ── Diff view ── */
    .diff-row {
      background: var(--bg2); border-radius: var(--radius);
      padding: 10px 14px; margin-bottom: 8px;
    }
    .diff-field { font-size: 11px; color: var(--hint); margin-bottom: 4px; }
    .diff-values { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .diff-old { color: var(--red); text-decoration: line-through; }
    .diff-arrow { color: var(--hint); }
    .diff-new { color: var(--green); font-weight: 700; }

    /* ── Skeleton loader ── */
    .skeleton {
      background: linear-gradient(90deg, var(--bg2) 25%, rgba(0,0,0,.06) 50%, var(--bg2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .sk-block { height: 14px; margin: 6px 0; }
    .sk-title { height: 18px; width: 55%; margin-bottom: 10px; }
    .sk-card { background: var(--bg2); border-radius: var(--radius); padding: 14px; margin-top: 10px; }
    .sk-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.05); gap: 10px; }
    .sk-row:last-child { border-bottom: none; }
    .sk-label { height: 12px; width: 38%; }
    .sk-val   { height: 12px; width: 28%; }

    /* ── Inline validation ── */
    .form-select.invalid, .form-input.invalid {
      border-color: var(--red) !important;
      background: #fff3f3;
    }
    .field-error { font-size: 11px; color: var(--red); padding: 3px 14px 6px; }

    /* ── Progress bar ── */
    .progress-wrap { padding: 14px 0 4px; }
    .progress-label { font-size: 11px; color: var(--hint); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .progress-track { height: 6px; background: var(--bg2); border-radius: 10px; overflow: hidden; }
    .progress-fill  { height: 100%; border-radius: 10px; background: var(--accent); transition: width .4s ease; }
    .stage-dots { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .stage-dot {
      font-size: 10px; padding: 3px 8px; border-radius: 20px;
      background: var(--bg2); color: var(--hint); font-weight: 600;
    }
    .stage-dot.done  { background: #e8f5e9; color: #2e7d32; }
    .stage-dot.active { background: #e3f2fd; color: #1565c0; }

    /* ── Bottom nav ── */
    .tab-bar {
      display: flex;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg);
      border-top: 1px solid var(--bg2);
      padding-bottom: env(safe-area-inset-bottom, 8px);
      z-index: 20;
    }
    .tab-item {
      flex: 1; text-align: center; padding: 10px 0;
      cursor: pointer; font-size: 10px; color: var(--hint);
      transition: color .15s;
    }
    .tab-item.active { color: var(--accent); }
    .tab-icon { font-size: 20px; display: block; margin-bottom: 2px; }

    .page-content { padding-bottom: 68px; }

    /* ── Audit log entries ── */
    .audit-entry {
      background: var(--bg2); border-radius: var(--radius);
      padding: 10px 14px; margin-bottom: 8px;
    }
    .audit-meta { font-size: 11px; color: var(--hint); margin-bottom: 5px; display: flex; justify-content: space-between; }
    .audit-field { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .audit-change { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .audit-old { color: var(--red); text-decoration: line-through; }
    .audit-new { color: var(--green); font-weight: 700; }

    /* ── Quick action buttons ── */
    .quick-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .quick-btn {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg2); border: none; border-radius: var(--radius);
      padding: 13px 16px; font-size: 14px; font-weight: 600;
      color: var(--text); cursor: pointer; text-align: left; width: 100%;
      transition: opacity .15s;
    }
    .quick-btn:active { opacity: .7; }
    .quick-btn .q-icon { font-size: 18px; flex-shrink: 0; }
    .quick-btn .q-label { flex: 1; }
    .quick-btn .q-arrow { color: var(--hint); font-size: 16px; }
    .quick-btn.primary { background: var(--accent); color: #fff; }
    .quick-btn.primary .q-arrow { color: rgba(255,255,255,.6); }

    /* ── Team breakdown table ── */
    .team-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
    .team-table th { text-align: left; color: var(--hint); font-weight: 700; padding: 5px 8px; border-bottom: 1px solid var(--bg2); font-size: 10px; text-transform: uppercase; }
    .team-table td { padding: 8px; border-bottom: 1px solid rgba(0,0,0,.04); }
    .team-table tr:last-child td { border-bottom: none; }
    .team-pct { font-weight: 700; color: var(--accent); }
    .mini-bar-track { height: 4px; background: var(--bg2); border-radius: 4px; margin-top: 3px; min-width: 40px; }
    .mini-bar-fill  { height: 100%; border-radius: 4px; background: var(--accent); }

    /* ── Sort bar ── */
    .sort-bar { display: flex; gap: 6px; align-items: center; margin: 8px 0 4px; }
    .sort-label { font-size: 11px; color: var(--hint); }
    .sort-chip {
      background: var(--bg2); border-radius: 20px;
      padding: 4px 10px; font-size: 11px; cursor: pointer;
      color: var(--hint); font-weight: 600; border: 1.5px solid transparent;
    }
    .sort-chip.active { color: var(--accent); border-color: var(--accent); }

    /* Clickable stat cards */
    .stat-card.clickable { cursor: pointer; }
    .stat-card.clickable:active { opacity: .72; transform: scale(.97); transition: transform .1s; }

    /* Filter chips for search results */
    .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
    .filter-chip {
      background: var(--bg2); border-radius: 20px;
      padding: 5px 12px; font-size: 12px; cursor: pointer;
      color: var(--text); font-weight: 600;
      border: 1.5px solid transparent; transition: all .15s;
    }
    .filter-chip.active { background: var(--accent); color: #fff; }

    /* Recent searches */
    .recent-label { font-size: 11px; color: var(--hint); margin: 14px 0 6px; }
    .recent-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: var(--bg2); border-radius: 20px;
      padding: 5px 12px; font-size: 12px; cursor: pointer;
      color: var(--accent); font-weight: 600;
    }
    .chip:active { opacity: .7; }
  </style>
</head>
<body>

<!-- ── SEARCH SCREEN ── -->
<div id="screen-search" class="screen active page-content">
  <div style="padding: 20px 0 8px;">
    <div style="font-size: 20px; font-weight: 800; margin-bottom: 4px;">SSV Tracker</div>
    <div style="font-size: 13px; color: var(--hint);">Search a site to view or update progress</div>
  </div>

  <div class="search-wrap">
    <div class="search-input-row">
      <input id="search-input" class="search-input" type="text"
        placeholder="Enter Site ID or city…" autocomplete="off" autocorrect="off"/>
      <button class="btn" onclick="handleSearch()">Search</button>
    </div>
    <div id="search-error"></div>
  </div>

  <div id="recent-wrap" style="display:none;">
    <div class="recent-label">Recent</div>
    <div id="recent-chips" class="recent-chips"></div>
  </div>

  <div id="search-results" class="result-list"></div>
</div>

<!-- ── SITE DETAIL SCREEN ── -->
<div id="screen-detail" class="screen page-content">
  <div class="header">
    <button class="back-btn" onclick="showScreen('search')">← Back</button>
    <h1 id="detail-title">Site Detail</h1>
    <button class="back-btn" style="color:var(--accent);font-size:18px;" onclick="refreshDetail()" title="Refresh">↻</button>
  </div>
  <div id="cache-indicator" style="display:none;padding:3px 16px 0;font-size:11px;color:var(--hint);"></div>
  <div id="detail-content" style="padding: 0 16px 16px;"></div>
</div>

<!-- ── DASHBOARD SCREEN ── -->
<div id="screen-dashboard" class="screen page-content">
  <div style="padding: 20px 0 8px;">
    <div style="font-size: 20px; font-weight: 800; margin-bottom: 4px;">Dashboard</div>
    <div style="font-size: 13px; color: var(--hint);">SSV rollout overview</div>
  </div>
  <div id="dashboard-content"></div>
</div>

<!-- ── UPDATE FORM SCREEN ── -->
<div id="screen-form" class="screen page-content">
  <div class="header">
    <button class="back-btn" onclick="showScreen('detail')">← Back</button>
    <h1 id="form-title">Update Site</h1>
  </div>
  <div id="form-content" style="padding: 0 16px 16px;"></div>
</div>

<!-- ── CONFIRM SCREEN ── -->
<div id="screen-confirm" class="screen page-content">
  <div class="header">
    <button class="back-btn" onclick="showScreen('form')">← Edit</button>
    <h1>Confirm Update</h1>
  </div>
  <div style="padding: 0 16px 16px;">
    <div style="font-size: 13px; color: var(--hint); margin: 12px 0 6px;">Changes to be saved:</div>
    <div id="confirm-diff"></div>
    <button class="btn btn-block" id="confirm-submit-btn" onclick="submitUpdate()" style="margin-top:20px;">
      ✅ Confirm &amp; Save
    </button>
    <button class="btn btn-outline btn-block" onclick="showScreen('form')" style="margin-top:8px;">
      ← Go Back &amp; Edit
    </button>
    <div id="confirm-error"></div>
  </div>
</div>

<!-- ── ESCALATION SCREEN ── -->
<div id="screen-escalation" class="screen page-content">
  <div class="header">
    <button class="back-btn" onclick="showScreen('detail')">← Back</button>
    <h1>Flag as Blocked</h1>
  </div>
  <div style="padding: 0 16px 16px;">
    <div style="background:#fff3f3;border:1px solid #ffcdd2;border-radius:var(--radius);padding:12px 14px;margin-top:12px;font-size:13px;color:var(--red);">
      ⚠️ This will notify the supervisor immediately.
    </div>
    <div class="section-block" style="margin-top:14px;">
      <div class="section-title">Flag Details</div>
      <div class="form-row">
        <label>Flag Type</label>
        <select id="esc-type" class="form-select">
          <option value="Blocked">Blocked</option>
          <option value="Access Issue">Access Issue</option>
          <option value="Equipment Missing">Equipment Missing</option>
          <option value="Permit Issue">Permit Issue</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <div class="section-block" style="margin-top:8px;">
      <div class="section-title">Reason</div>
      <div style="padding:10px 14px;">
        <textarea id="esc-reason" rows="4"
          style="width:100%;border:1.5px solid var(--bg2);border-radius:6px;padding:10px;font-size:13px;color:var(--text);background:var(--bg2);resize:none;outline:none;font-family:inherit;"
          placeholder="Describe what is blocking this site…"></textarea>
      </div>
    </div>
    <button class="btn btn-block" id="esc-submit-btn"
      style="margin-top:16px;background:var(--red);"
      onclick="submitEscalation()">🚨 Send Alert to Supervisor</button>
    <div id="esc-error"></div>
  </div>
</div>

<!-- ── AUDIT LOG SCREEN ── -->
<div id="screen-audit" class="screen page-content">
  <div class="header">
    <button class="back-btn" onclick="showScreen('detail')">← Back</button>
    <h1 id="audit-title">History</h1>
  </div>
  <div id="audit-content" style="padding: 0 16px 16px;"></div>
</div>

<!-- ── DRILLDOWN SCREEN ── -->
<div id="screen-drill" class="screen page-content">
  <div class="header">
    <button class="back-btn" onclick="showScreen('dashboard')">← Back</button>
    <h1 id="drill-title">Sites</h1>
  </div>
  <div id="drill-content" style="padding: 0 16px 16px;"></div>
</div>

<!-- ── TAB BAR ── -->
<nav class="tab-bar">
  <div class="tab-item active" id="tab-search" onclick="switchTab('search')" style="position:relative;">
    <span class="tab-icon">🔍</span>Search
    <span id="queue-badge" style="display:none;position:absolute;top:6px;right:18px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center;"></span>
  </div>
  <div class="tab-item" id="tab-dashboard" onclick="switchTab('dashboard')">
    <span class="tab-icon">📊</span>Dashboard
  </div>
</nav>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
var GAS_URL  = 'https://script.google.com/macros/s/AKfycbxj44gOO6BrpAGWJ4YSmI2USsOkUPE4LBxE_1B1LQJR8HxJDSVkzYaKZd1JJMFCVO4I/exec';
var API_KEY  = 'YWY0OGFmZGMtZmM2ZS00';

// ── TELEGRAM INIT ────────────────────────────────────────────────────────────
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

function getInitData() {
  return tg ? tg.initData : '';
}

// ── API ──────────────────────────────────────────────────────────────────────
function apiFetch(action, params) {
  var url = GAS_URL + '?action=' + action;
  Object.keys(params || {}).forEach(function(k) {
    url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  });
  return fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.success) throw new Error(data.error || 'API error');
      return data;
    });
}

// ── SCREEN NAVIGATION ────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById('screen-' + id).classList.add('active');
  // Telegram MainButton: show only on confirm screen
  if (tg && tg.MainButton) {
    if (id === 'confirm') {
      tg.MainButton.setText('✅ Confirm & Save');
      tg.MainButton.show();
    } else {
      tg.MainButton.hide();
    }
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'dashboard') {
    showScreen('dashboard');
    loadDashboard();
  } else {
    showScreen('search');
  }
}

// ── CACHE ────────────────────────────────────────────────────────────────────
var CACHE_TTL = 5 * 60 * 1000; // 5 minutes

function getCached(key) {
  try {
    var item = JSON.parse(localStorage.getItem('ssv_c_' + key));
    if (!item || Date.now() - item.ts > CACHE_TTL) return null;
    return item.data;
  } catch(e) { return null; }
}

function setCache(key, data) {
  try { localStorage.setItem('ssv_c_' + key, JSON.stringify({ ts: Date.now(), data: data })); } catch(e) {}
}

function getCacheAge(key) {
  try {
    var item = JSON.parse(localStorage.getItem('ssv_c_' + key));
    if (!item) return null;
    return Math.round((Date.now() - item.ts) / 60000);
  } catch(e) { return null; }
}

function bustCache(key) {
  try { localStorage.removeItem('ssv_c_' + key); } catch(e) {}
}

function showCacheIndicator(ageMin) {
  var el = document.getElementById('cache-indicator');
  if (!el) return;
  if (ageMin === null || ageMin === 0) {
    el.style.display = 'none';
  } else {
    el.style.display = 'block';
    el.innerHTML = '🕐 Cached · ' + ageMin + ' min ago — <span style="color:var(--accent);cursor:pointer;" onclick="refreshDetail()">Refresh</span>';
  }
}

function hideCacheIndicator() {
  var el = document.getElementById('cache-indicator');
  if (el) el.style.display = 'none';
}

// ── OFFLINE QUEUE ─────────────────────────────────────────────────────────────
function getQueue() {
  try { return JSON.parse(localStorage.getItem('ssv_queue') || '[]'); } catch(e) { return []; }
}

function saveQueue(q) {
  try { localStorage.setItem('ssv_queue', JSON.stringify(q)); } catch(e) {}
}

function enqueue(siteId, fields) {
  var q = getQueue().filter(function(i) { return i.siteId !== siteId; });
  q.push({ siteId: siteId, fields: fields, ts: Date.now() });
  saveQueue(q);
  updateQueueBadge();
}

function dequeue(siteId) {
  saveQueue(getQueue().filter(function(i) { return i.siteId !== siteId; }));
  updateQueueBadge();
}

function updateQueueBadge() {
  var count = getQueue().length;
  var badge = document.getElementById('queue-badge');
  if (!badge) return;
  if (count > 0) { badge.style.display = 'inline-block'; badge.textContent = count; }
  else { badge.style.display = 'none'; }
}

function syncQueue() {
  if (!navigator.onLine) return;
  var q = getQueue();
  if (!q.length) return;
  q.forEach(function(item) {
    var url = GAS_URL +
      '?action=updateSiteData' +
      '&key='    + encodeURIComponent(API_KEY) +
      '&siteId=' + encodeURIComponent(item.siteId) +
      '&fields=' + encodeURIComponent(JSON.stringify(item.fields)) +
      '&userId=queued_update';
    fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success) {
          dequeue(item.siteId);
          bustCache('site_' + item.siteId);
          showSuccessBanner('✅ Synced update for ' + item.siteId);
        }
      })
      .catch(function() {});
  });
}

window.addEventListener('online', function() {
  showSuccessBanner('🌐 Back online — syncing…');
  syncQueue();
});

// ── PULL-TO-REFRESH ───────────────────────────────────────────────────────────
(function() {
  var startY = 0;
  var pulling = false;
  var threshold = 70;

  document.addEventListener('touchstart', function(e) {
    startY = e.touches[0].clientY;
    pulling = window.scrollY === 0;
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    if (!pulling) return;
    var dy = e.changedTouches[0].clientY - startY;
    if (dy > threshold) {
      var active = document.querySelector('.screen.active');
      if (!active) return;
      var id = active.id;
      if (id === 'screen-detail') refreshDetail();
      else if (id === 'screen-dashboard') { dashLoaded = false; loadDashboard(); }
      else if (id === 'screen-drill') {
        var title = document.getElementById('drill-title').textContent;
        showSuccessBanner('↻ Refreshed');
      }
    }
    pulling = false;
  }, { passive: true });
})();

// ── SEARCH ───────────────────────────────────────────────────────────────────
var searchDebounce = null;
document.getElementById('search-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { clearTimeout(searchDebounce); handleSearch(); }
});
document.getElementById('search-input').addEventListener('input', function() {
  clearTimeout(searchDebounce);
  var q = this.value.trim();
  if (q.length < 2) return;
  searchDebounce = setTimeout(handleSearch, 350);
});

var lastSearchResults = [];
var activeSearchFilter = null;
var activeSort = 'siteId'; // 'siteId' | 'team' | 'region'

function handleSearch() {
  var q = document.getElementById('search-input').value.trim();
  if (!q) return;
  var container = document.getElementById('search-results');
  var errEl = document.getElementById('search-error');
  errEl.innerHTML = '';
  container.innerHTML = loadingHtml('Searching…');
  activeSearchFilter = null;

  apiFetch('searchSite', { query: q })
    .then(function(data) {
      lastSearchResults = data.results || [];
      if (!lastSearchResults.length) {
        container.innerHTML = '<div class="empty-msg">No sites found for "' + escHtml(q) + '"</div>';
        return;
      }
      renderSearchResults();
    })
    .catch(function(err) {
      container.innerHTML = '';
      errEl.innerHTML = '<div class="error-msg">⚠ ' + escHtml(err.message) + '</div>';
    });
}

function renderSearchResults() {
  var container = document.getElementById('search-results');
  var results = lastSearchResults;

  // Team filter chips
  var teams = [];
  results.forEach(function(r) {
    if (r.team && teams.indexOf(r.team) === -1) teams.push(r.team);
  });

  var html = '';
  if (teams.length > 1) {
    html += '<div class="filter-bar">';
    teams.forEach(function(team) {
      var active = activeSearchFilter === team;
      html += '<span class="filter-chip' + (active ? ' active' : '') +
        '" onclick="setSearchFilter(\'' + escHtml(team) + '\')">' + escHtml(team) + '</span>';
    });
    if (activeSearchFilter) {
      html += '<span class="filter-chip active" onclick="setSearchFilter(null)">✕ Clear</span>';
    }
    html += '</div>';
  }

  // Sort bar
  html += '<div class="sort-bar">' +
    '<span class="sort-label">Sort:</span>' +
    ['siteId','team','region'].map(function(s) {
      var labels = { siteId:'Site ID', team:'Team', region:'Region' };
      return '<span class="sort-chip' + (activeSort === s ? ' active' : '') +
        '" onclick="setSort(\'' + s + '\')">' + labels[s] + '</span>';
    }).join('') +
  '</div>';

  // Filter + sort
  var filtered = activeSearchFilter
    ? results.filter(function(r) { return r.team === activeSearchFilter; })
    : results.slice();

  filtered.sort(function(a, b) {
    var ka = String(a[activeSort] || a.siteId).toLowerCase();
    var kb = String(b[activeSort] || b.siteId).toLowerCase();
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });

  html += filtered.map(function(r) {
    return '<div class="result-item" onclick="loadSite(\'' + escHtml(r.siteId) + '\')">' +
      '<div class="site-id">' + escHtml(r.siteId) + '</div>' +
      '<div class="meta">' + [r.team, r.region, r.city, r.scopeType].filter(Boolean).map(escHtml).join(' · ') + '</div>' +
    '</div>';
  }).join('');

  container.innerHTML = html;
}

function setSearchFilter(team) {
  activeSearchFilter = team;
  renderSearchResults();
}

function setSort(s) {
  activeSort = s;
  renderSearchResults();
}

// ── QUICK ACTIONS ────────────────────────────────────────────────────────────

function renderQuickActions(s) {
  var actions = [];

  var onAir      = String(s['Site On-Air']        || '').toLowerCase();
  var testDone   = String(s['Test Finished']       || '').toLowerCase();
  var anaDone    = String(s['Analysis Finished']   || '').toLowerCase();
  var interv     = String(s['Intervention Req.']   || '').toLowerCase();
  var changeDone = String(s['Change Completed']    || '').toLowerCase();
  var ssvPassed  = String(s['SSV Passed']          || '').toLowerCase();

  if (onAir !== 'yes') {
    actions.push({ icon: '📡', label: 'Mark Site On-Air',      field: 'Site On-Air',       value: 'Yes', primary: true });
  } else if (testDone !== 'yes') {
    actions.push({ icon: '🧪', label: 'Mark Test Done',         field: 'Test Finished',     value: 'Yes', primary: true });
  } else if (anaDone !== 'yes') {
    actions.push({ icon: '📊', label: 'Mark Analysis Done',     field: 'Analysis Finished', value: 'Yes', primary: true });
  } else if (interv === 'yes' && changeDone !== 'yes') {
    actions.push({ icon: '🔧', label: 'Mark Change Completed',  field: 'Change Completed',  value: 'Yes', primary: true });
  } else if (ssvPassed !== 'yes') {
    actions.push({ icon: '✅', label: 'Mark SSV Passed',        field: 'SSV Passed',        value: 'Yes', primary: true });
  }

  if (!actions.length) {
    return '<div style="margin-top:14px;padding:12px 14px;background:#e8f5e9;border-radius:var(--radius);font-size:13px;color:#2e7d32;font-weight:600;">✅ SSV Complete</div>';
  }

  var html = '<div class="quick-actions">';
  actions.forEach(function(a) {
    html += '<button class="quick-btn' + (a.primary ? ' primary' : '') + '" onclick="submitQuickUpdate(\'' +
      escHtml(a.field) + '\',\'' + escHtml(a.value) + '\',\'' + escHtml(a.label) + '\')">' +
      '<span class="q-icon">' + a.icon + '</span>' +
      '<span class="q-label">' + escHtml(a.label) + '</span>' +
      '<span class="q-arrow">›</span>' +
    '</button>';
  });
  html += '</div>';
  return html;
}

function submitQuickUpdate(field, value, label) {
  if (!currentSiteId) return;
  var fields = {};
  fields[field] = value;

  var url = GAS_URL +
    '?action=updateSiteData' +
    '&key='    + encodeURIComponent(API_KEY) +
    '&siteId=' + encodeURIComponent(currentSiteId) +
    '&fields=' + encodeURIComponent(JSON.stringify(fields)) +
    '&userId=' + encodeURIComponent((tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
                   ? String(tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.id)
                   : 'webapp_user');

  // Optimistic UI — show loading immediately
  document.getElementById('detail-content').innerHTML = loadingHtml('Saving…');

  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.success) throw new Error(data.error || 'Update failed');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      currentSiteData[field] = value;
      showSuccessBanner('✅ ' + label);
      renderSiteDetail(currentSiteData);
    })
    .catch(function(err) {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      renderSiteDetail(currentSiteData);
      document.getElementById('confirm-error');
      showSuccessBanner('⚠ ' + err.message);
    });
}

// ── SITE DETAIL ───────────────────────────────────────────────────────────────
function loadSite(siteId) {
  saveRecent(siteId);
  showScreen('detail');
  document.getElementById('detail-title').textContent = siteId;

  var cached = getCached('site_' + siteId);
  if (cached) {
    currentSiteId   = siteId;
    currentSiteData = cached.site;
    renderSiteDetail(cached.site);
    var age = getCacheAge('site_' + siteId);
    showCacheIndicator(age);
    // Silent background refresh
    apiFetch('getSiteData', { siteId: siteId })
      .then(function(data) {
        setCache('site_' + siteId, data);
        currentSiteData = data.site;
        renderSiteDetail(data.site);
        hideCacheIndicator();
      })
      .catch(function() {});
  } else {
    hideCacheIndicator();
    document.getElementById('detail-content').innerHTML = skeletonDetailHtml();
    apiFetch('getSiteData', { siteId: siteId })
      .then(function(data) {
        setCache('site_' + siteId, data);
        currentSiteId   = siteId;
        currentSiteData = data.site;
        renderSiteDetail(data.site);
      })
      .catch(function(err) {
        document.getElementById('detail-content').innerHTML =
          '<div class="error-msg">⚠ ' + escHtml(err.message) + '</div>';
      });
  }
}

    ['Site ID',    s['Site ID']],
    ['Team',       s['Team']],
    ['Region',     s['Region']],
    ['City',       s['City']],
    ['Scope Type', s['Scope Type']],
    ['Batch',      s['Batch']]
  ]);

  // Execution
  html += section('Execution', [
    ['On-Air Plan',   fmtDate(s['On-Air Plan'])],
    ['On-Air Actual', fmtDate(s['On-Air Actual'])],

  ]);

    ['Test Date Planned', fmtDate(s['Test Date Planned'])],
    ['Test Date Actual',  fmtDate(s['Test Date Actual'])],

  ]);

  ]);

function section(title, fields) {
  var rows = fields.map(function(f) {
    var label = f[0], val = f[1] || '', type = f[2];
    var display = type === 'badge' ? badgeHtml(val) : '<span class="field-value">' + escHtml(val || '—') + '</span>';
    return '<div class="field-row"><span class="field-label">' + escHtml(label) + '</span>' + display + '</div>';
  }).join('');
  return '<div class="section-block"><div class="section-title">' + escHtml(title) + '</div>' + rows + '</div>';
}

function badgeHtml(val) {
  var v = String(val || '').toLowerCase();
  var cls = v === 'yes' ? 'badge-yes' : v === 'no' ? 'badge-no' : 'badge-blank';
  return '<span class="badge ' + cls + '">' + escHtml(val || '—') + '</span>';
}

  el.innerHTML = skeletonDashHtml();

    .then(function(results) {

      setCache('dash_teams',   results[1].teams);

      statCard(s.ssvPassed,            'SSV Passed',    'green',  'openDrilldown("SSV Passed","Yes","SSV Passed")')      +
      statCard(s.interventionRequired, 'Interventions', 'orange', 'openDrilldown("Intervention Req.","Yes","Interventions Required")') +
      statCard(s.pending,              'Pending SSV',   'red',    'openDrilldown("SSV Passed","pending","Pending SSV")') +
    '</div>';

  // Team breakdown
  if (teams && teams.length) {
    html += '<div style="margin-top:16px;">' +
      '<div style="font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--hint);text-transform:uppercase;margin-bottom:6px;">Team Progress</div>' +
      '<div style="background:var(--bg2);border-radius:var(--radius);overflow:hidden;padding:4px 0;">' +

      '</tr></thead><tbody>';
    teams.forEach(function(t) {
      var pct = t.total > 0 ? Math.round((t.ssvPassed / t.total) * 100) : 0;
      html += '<tr>' +
        '<td style="font-weight:600;">' + escHtml(t.name) + '</td>' +
        '<td style="text-align:center;">' + t.total + '</td>' +
        '<td style="text-align:center;">' + t.onAir + '</td>' +
        '<td style="text-align:center;color:var(--green);font-weight:700;">' + t.ssvPassed + '</td>' +
        '<td><span class="team-pct">' + pct + '%</span>' +
          '<div class="mini-bar-track"><div class="mini-bar-fill" style="width:' + pct + '%"></div></div>' +
        '</td>' +
      '</tr>';
    });
    html += '</tbody></table></div></div>';
  }

  // Supervisor setup
  html += '<div style="margin-top:14px;padding:14px;background:var(--bg2);border-radius:var(--radius);">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--hint);text-transform:uppercase;margin-bottom:10px;">Escalation Alerts</div>' +
    '<button class="btn btn-outline" style="width:100%;font-size:13px;" onclick="openSupervisorSetup()">⚙ Set Me as Supervisor</button>' +
    '<div id="supervisor-status" style="font-size:12px;color:var(--hint);margin-top:8px;text-align:center;"></div>' +
  '</div>';

  document.getElementById('dashboard-content').innerHTML = html;
}

function escHtml(s) {

}

// Convert any date format to YYYY-MM-DD for <input type="date"> value
function toISODate(val) {
  if (!val) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(val)) return val.slice(0, 10);
  var m = val.match(/^(\d{2})-([A-Za-z]{3})-(\d{2})$/);
  if (m) {
    var months = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
    var mo = months[m[2]];
    if (!mo) return '';
    return (2000 + parseInt(m[3])) + '-' + String(mo).padStart(2,'0') + '-' + m[1];
  }
  var d = new Date(val);
  if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
  return '';
}

// Format ISO date strings to DD-MMM-YY; pass through anything else
function fmtDate(val) {
  if (!val) return '—';
  var d = new Date(val);
  if (isNaN(d.getTime())) return val;
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var dd = String(d.getDate()).padStart(2,'0');
  var mm = months[d.getMonth()];
  var yy = String(d.getFullYear()).slice(-2);
  return dd + '-' + mm + '-' + yy;
}

// ── PROGRESS BAR ─────────────────────────────────────────────────────────────

var STAGES = [
  { label: 'On-Air',    key: 'Site On-Air' },
  { label: 'Tested',    key: 'Test Finished' },
  { label: 'Analysed',  key: 'Analysis Finished' },
  { label: 'Changed',   key: 'Change Completed' },
  { label: 'SSV Pass',  key: 'SSV Passed' }
];

function renderProgressBar(s) {
  var done = 0;
  var activeIdx = -1;
  STAGES.forEach(function(st, i) {
    if (String(s[st.key] || '').toLowerCase() === 'yes') { done = i + 1; }
  });
  activeIdx = done < STAGES.length ? done : STAGES.length - 1;
  var pct = Math.round((done / STAGES.length) * 100);

  var dots = STAGES.map(function(st, i) {
    var cls = i < done ? 'done' : (i === activeIdx && done < STAGES.length ? 'active' : '');
    return '<span class="stage-dot ' + cls + '">' + (i < done ? '✓ ' : '') + escHtml(st.label) + '</span>';
  }).join('');

  return '<div class="progress-wrap">' +
    '<div class="progress-label"><span>SSV Progress</span><span>' + done + ' / ' + STAGES.length + ' stages</span></div>' +
    '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="stage-dots">' + dots + '</div>' +
  '</div>';
}

// ── UPDATE FORM ──────────────────────────────────────────────────────────────

var currentSiteId   = null; // Site ID being edited
var currentSiteData = null; // Full site row (read-only snapshot)
var pendingFields   = {};   // Staged changes { fieldName: newValue }

var FORM_SECTIONS = [
  {
    title: 'Section A — Execution',
    fields: [
      { key: 'On-Air Actual',  label: 'On-Air Actual',  type: 'date' },
      { key: 'Site On-Air',    label: 'Site On-Air',     type: 'yesno' }
    ]
  },
  {
    title: 'Section B — Testing',
    id: 'section-testing',
    fields: [
      { key: 'Test Date Actual', label: 'Test Date Actual', type: 'date' },
      { key: 'Test Finished',    label: 'Test Finished',    type: 'yesno' }
    ]
  },
  {
    title: 'Section C — Analysis',
    id: 'section-analysis',
    fields: [
      { key: 'Analysis Actual',   label: 'Analysis Actual',   type: 'date' },
      { key: 'Analysis Finished', label: 'Analysis Finished', type: 'yesno' }
    ]
  },
  {
    title: 'Section D — Change Control',
    id: 'section-change',
    fields: [
      { key: 'Intervention Req.',     label: 'Intervention Req.',     type: 'yesno' },
      { key: 'Change Date Actual',    label: 'Change Date Actual',    type: 'date', id: 'change-date-row' },
      { key: 'Change Completed',      label: 'Change Completed',      type: 'yesno', id: 'change-completed-row' }
    ]
  },
  {
    title: 'Section E — Final Acceptance',
    fields: [
      { key: 'SSV Passed', label: 'SSV Passed', type: 'yesno' },
      { key: 'Remarks',    label: 'Remarks',    type: 'text' }
    ]
  }
];

function openUpdateForm() {
  if (!currentSiteId || !currentSiteData) return;
  pendingFields = {};
  document.getElementById('form-title').textContent = 'Update ' + currentSiteId;
  renderForm();
  showScreen('form');
}

function renderForm() {
  var s = currentSiteData;
  var html = '';

  FORM_SECTIONS.forEach(function(section) {
    html += '<div class="form-section"' + (section.id ? ' id="' + section.id + '"' : '') + '>';
    html += '<div class="form-section-title">' + escHtml(section.title) + '</div>';
    html += '<div class="form-group">';
    section.fields.forEach(function(f) {
      html += renderFormField(f, s[f.key] || '');
    });
    html += '</div></div>';
  });

  html += '<button class="btn btn-block" style="margin-top:20px;" onclick="goToConfirm()">Review Changes →</button>';
  document.getElementById('form-content').innerHTML = html;

  applySmartLogic();
}

function renderFormField(f, currentVal) {
  var rowId  = f.id ? ' id="' + f.id + '"' : '';
  var inputId = 'field-' + f.key.replace(/\s+/g, '-');
  var input   = '';

  if (f.type === 'yesno') {
    input = '<select class="form-select" id="' + inputId + '" onchange="onFieldChange(\'' + f.key + '\',this.value)">' +
      '<option value="">—</option>' +
      '<option value="Yes"' + (currentVal === 'Yes' ? ' selected' : '') + '>Yes</option>' +
      '<option value="No"'  + (currentVal === 'No'  ? ' selected' : '') + '>No</option>' +
      '</select>';
  } else if (f.type === 'date') {
    input = '<input class="form-input" id="' + inputId + '" type="date"' +
      ' value="' + escHtml(toISODate(currentVal)) + '"' +
      ' onchange="onFieldChange(\'' + f.key + '\',this.value)"' +
      ' oninput="onFieldChange(\'' + f.key + '\',this.value)"/>';
  } else {
    input = '<input class="form-input" id="' + inputId + '" type="text" placeholder="Optional…"' +
      ' value="' + escHtml(currentVal) + '"' +
      ' onchange="onFieldChange(\'' + f.key + '\',this.value)"' +
      ' oninput="onFieldChange(\'' + f.key + '\',this.value)"/>';
  }

  return '<div class="form-row"' + rowId + '><label>' + escHtml(f.label) + '</label>' + input + '</div>';
}

function onFieldChange(key, value) {
  pendingFields[key] = value.trim();
}

// Smart logic: conditional field visibility
function applySmartLogic() {
  var siteOnAir   = document.getElementById('field-Site-On-Air');
  var testSection = document.getElementById('section-testing');
  var anaSection  = document.getElementById('section-analysis');
  var intervention = document.getElementById('field-Intervention-Req.');
  var changeDateRow = document.getElementById('change-date-row');
  var changeCompRow = document.getElementById('change-completed-row');

  function update() {
    var onAirVal = siteOnAir ? siteOnAir.value : '';
    var interVal = intervention ? intervention.value : '';

    if (testSection) testSection.style.opacity = (onAirVal === 'No') ? '.4' : '1';
    if (anaSection)  anaSection.style.opacity  = (onAirVal === 'No') ? '.4' : '1';

    var showChange = interVal === 'Yes';
    if (changeDateRow) changeDateRow.style.display = showChange ? '' : 'none';
    if (changeCompRow) changeCompRow.style.display = showChange ? '' : 'none';
  }

  if (siteOnAir)    siteOnAir.addEventListener('change', update);
  if (intervention) intervention.addEventListener('change', update);
  update();
}

// ── CONFIRM SCREEN ────────────────────────────────────────────────────────────

function goToConfirm() {
  // Clear previous validation
  document.querySelectorAll('.form-select.invalid, .form-input.invalid').forEach(function(el) {
    el.classList.remove('invalid');
  });
  document.querySelectorAll('.field-error').forEach(function(el) { el.remove(); });

  // Filter to only actually-changed values
  var changed = {};
  Object.keys(pendingFields).forEach(function(key) {
    var newVal = pendingFields[key];
    var oldVal = String(currentSiteData[key] || '').trim();
    if (newVal !== oldVal && newVal !== '') changed[key] = newVal;
  });

  if (!Object.keys(changed).length) {
    showScreen('form');
    var errBanner = document.createElement('div');
    errBanner.style.cssText = 'position:fixed;top:16px;left:16px;right:16px;background:#fff3f3;' +
      'border:1px solid #ffcdd2;border-radius:10px;padding:12px 16px;font-size:13px;' +
      'color:var(--red);font-weight:600;z-index:99;text-align:center;';
    errBanner.textContent = 'No changes made. Edit a field first.';
    document.body.appendChild(errBanner);
    setTimeout(function() { errBanner.remove(); }, 3000);
    return;
  }

  pendingFields = changed; // keep only real changes

  var html = Object.keys(changed).map(function(key) {
    var oldVal = String(currentSiteData[key] || '—');
    var newVal = changed[key] || '—';
    return '<div class="diff-row">' +
      '<div class="diff-field">' + escHtml(key) + '</div>' +
      '<div class="diff-values">' +
        '<span class="diff-old">'   + escHtml(oldVal) + '</span>' +
        '<span class="diff-arrow">→</span>' +
        '<span class="diff-new">'   + escHtml(newVal) + '</span>' +
      '</div>' +
    '</div>';
  }).join('');

  document.getElementById('confirm-diff').innerHTML = html;
  document.getElementById('confirm-error').innerHTML = '';
  document.getElementById('confirm-submit-btn').disabled = false;
  showScreen('confirm');
}

// ── SUBMIT ────────────────────────────────────────────────────────────────────

function submitUpdate() {
  var btn = document.getElementById('confirm-submit-btn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  if (tg && tg.MainButton) { tg.MainButton.showProgress(false); tg.MainButton.disable(); }

  var url = GAS_URL +
    '?action=updateSiteData' +
    '&key='    + encodeURIComponent(API_KEY) +
    '&siteId=' + encodeURIComponent(currentSiteId) +
    '&fields=' + encodeURIComponent(JSON.stringify(pendingFields)) +
    '&userId=' + encodeURIComponent((tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
                   ? String(tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.id)
                   : 'webapp_user');

  fetch(url)
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (!data.success) throw new Error(data.error || 'Update failed');

    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

    Object.keys(pendingFields).forEach(function(k) { currentSiteData[k] = pendingFields[k]; });
    bustCache('site_' + currentSiteId);
    pendingFields = {};

    if (tg && tg.MainButton) { tg.MainButton.hideProgress(); tg.MainButton.hide(); }
    showSuccessBanner(data.result.message);
    showScreen('detail');
    renderSiteDetail(currentSiteData);
  })
  .catch(function(err) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    btn.disabled = false;
    btn.textContent = '✅ Confirm & Save';
    if (tg && tg.MainButton) { tg.MainButton.hideProgress(); tg.MainButton.enable(); }

    // Queue for retry if network error
    var isNetworkErr = err.message === 'Failed to fetch' || !navigator.onLine;
    if (isNetworkErr) {
      enqueue(currentSiteId, pendingFields);
      document.getElementById('confirm-error').innerHTML =
        '<div class="error-msg" style="margin-top:12px;">📶 No connection — update saved locally and will sync when online.</div>';
    } else {
      document.getElementById('confirm-error').innerHTML =
        '<div class="error-msg" style="margin-top:12px;">⚠ ' + escHtml(err.message) + '</div>';
    }
  });
}

function showSuccessBanner(msg) {
  var banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:16px;left:16px;right:16px;background:#e8f5e9;' +
    'border:1px solid #a5d6a7;border-radius:10px;padding:12px 16px;font-size:13px;' +
    'color:#2e7d32;font-weight:600;z-index:99;text-align:center;';
  banner.textContent = '✅ ' + msg;
  document.body.appendChild(banner);
  setTimeout(function() { banner.remove(); }, 3000);
}

// ── ESCALATION ───────────────────────────────────────────────────────────────

function openEscalation() {
  document.getElementById('esc-type').value = 'Blocked';
  document.getElementById('esc-reason').value = '';
  document.getElementById('esc-error').innerHTML = '';
  document.getElementById('esc-submit-btn').disabled = false;
  document.getElementById('esc-submit-btn').textContent = '🚨 Send Alert to Supervisor';
  showScreen('escalation');
}

function submitEscalation() {
  var flagType = document.getElementById('esc-type').value;
  var reason   = document.getElementById('esc-reason').value.trim();
  var btn      = document.getElementById('esc-submit-btn');

  if (!reason) {
    document.getElementById('esc-error').innerHTML =
      '<div class="error-msg" style="margin-top:10px;">⚠ Please describe what is blocking the site.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending…';
  if (tg && tg.MainButton) tg.MainButton.hide();

  var escUrl = GAS_URL +
    '?action=flagEscalation' +
    '&key='      + encodeURIComponent(API_KEY) +
    '&siteId='   + encodeURIComponent(currentSiteId) +
    '&flagType=' + encodeURIComponent(flagType) +
    '&reason='   + encodeURIComponent(reason) +
    '&userId='   + encodeURIComponent((tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
                     ? String(tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.id)
                     : 'webapp_user');

  fetch(escUrl)
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (!data.success) throw new Error(data.error || 'Escalation failed');
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    showSuccessBanner('🚨 Supervisor notified for site ' + currentSiteId);
    showScreen('detail');
  })
  .catch(function(err) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    btn.disabled = false;
    btn.textContent = '🚨 Send Alert to Supervisor';
    document.getElementById('esc-error').innerHTML =
      '<div class="error-msg" style="margin-top:10px;">⚠ ' + escHtml(err.message) + '</div>';
  });
}

// Wire Telegram MainButton
if (tg && tg.MainButton) {
