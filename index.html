<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>SSV Site Tracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        var(--tg-theme-bg-color, #ffffff);
      --bg2:       var(--tg-theme-secondary-bg-color, #f4f4f5);
      --text:      var(--tg-theme-text-color, #111111);
      --hint:      var(--tg-theme-hint-color, #888888);
      --link:      var(--tg-theme-link-color, #2481cc);
      --btn:       var(--tg-theme-button-color, #2481cc);
      --btn-text:  var(--tg-theme-button-text-color, #ffffff);
      --accent:    #2481cc;
      --red:       #e53935;
      --green:     #43a047;
      --orange:    #fb8c00;
      --radius:    10px;
      --font:      -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }

    /* ── Screens ── */
    .screen { display: none; padding: 16px; animation: fadeIn .15s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--bg2);
      position: sticky; top: 0; background: var(--bg); z-index: 10;
    }
    .header h1 { font-size: 16px; font-weight: 700; flex: 1; }
    .back-btn {
      background: none; border: none; color: var(--link);
      font-size: 14px; cursor: pointer; padding: 4px 0;
    }

    /* ── Search Screen ── */
    .search-wrap { margin-top: 20px; }
    .search-input-row {
      display: flex; gap: 8px;
    }
    .search-input {
      flex: 1;
      border: 1.5px solid var(--bg2);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 15px;
      background: var(--bg2);
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--accent); background: var(--bg); }
    .btn {
      background: var(--btn);
      color: var(--btn-text);
      border: none; border-radius: var(--radius);
      padding: 12px 18px; font-size: 14px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .btn:active { opacity: .8; }
    .btn-outline {
      background: none; border: 1.5px solid var(--btn);
      color: var(--btn);
    }
    .btn-block { width: 100%; margin-top: 10px; padding: 14px; }

    /* Search results list */
    .result-list { margin-top: 14px; }
    .result-item {
      background: var(--bg2);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .result-item:active { opacity: .7; }
    .result-item .site-id { font-weight: 700; font-size: 14px; color: var(--accent); }
    .result-item .meta { font-size: 12px; color: var(--hint); margin-top: 3px; }

    /* ── Dashboard Screen ── */
    .dash-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-top: 16px;
    }
    .stat-card {
      background: var(--bg2); border-radius: var(--radius);
      padding: 16px 12px; text-align: center;
    }
    .stat-card .num {
      font-size: 28px; font-weight: 800; line-height: 1;
    }
    .stat-card .label { font-size: 11px; color: var(--hint); margin-top: 5px; }
    .stat-card.green .num { color: var(--green); }
    .stat-card.blue  .num { color: var(--accent); }
    .stat-card.orange .num { color: var(--orange); }
    .stat-card.red   .num { color: var(--red); }

    /* ── Site Detail Screen ── */
    .section-block {
      background: var(--bg2); border-radius: var(--radius);
      margin-top: 12px; overflow: hidden;
    }
    .section-title {
      font-size: 11px; font-weight: 700; letter-spacing: .8px;
      color: var(--hint); padding: 10px 14px 6px;
      text-transform: uppercase; border-bottom: 1px solid rgba(0,0,0,.06);
    }
    .field-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 14px; border-bottom: 1px solid rgba(0,0,0,.04);
    }
    .field-row:last-child { border-bottom: none; }
    .field-label { font-size: 13px; color: var(--hint); }
    .field-value { font-size: 13px; font-weight: 600; text-align: right; max-width: 55%; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }
    .badge-yes   { background: #e8f5e9; color: #2e7d32; }
    .badge-no    { background: #fce4ec; color: #c62828; }
    .badge-blank { background: var(--bg2); color: var(--hint); }

    /* ── Loading & Error ── */
    .loading {
      text-align: center; padding: 40px 20px;
      color: var(--hint); font-size: 14px;
    }
    .loading .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--bg2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: #fff3f3; border: 1px solid #ffcdd2;
      border-radius: var(--radius); padding: 12px 14px;
      color: var(--red); font-size: 13px; margin-top: 12px;
    }
    .empty-msg {
      text-align: center; padding: 32px 20px;
      color: var(--hint); font-size: 14px;
    }

    /* ── Form Elements ── */
    .form-section { margin-top: 12px; }
    .form-section-title {
      font-size: 11px; font-weight: 700; letter-spacing: .8px;
      color: var(--hint); text-transform: uppercase;
      padding: 10px 0 6px;
    }
    .form-group {
      background: var(--bg2); border-radius: var(--radius);
      overflow: hidden; margin-bottom: 2px;
    }
    .form-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid rgba(0,0,0,.05);
      gap: 10px;
    }
    .form-row:last-child { border-bottom: none; }
    .form-row label { font-size: 13px; color: var(--text); flex-shrink: 0; max-width: 48%; }
    .form-row label.disabled { color: var(--hint); }
    .form-select, .form-input {
      flex: 1; background: var(--bg); border: 1.5px solid transparent;
      border-radius: 6px; padding: 7px 10px; font-size: 13px;
      color: var(--text); outline: none; text-align: right;
      transition: border-color .2s;
    }
    .form-select:focus, .form-input:focus { border-color: var(--accent); }
    .form-select:disabled, .form-input:disabled {
      opacity: .4; cursor: not-allowed; background: var(--bg2);
    }

    /* ── Diff view ── */
    .diff-row {
      background: var(--bg2); border-radius: var(--radius);
      padding: 10px 14px; margin-bottom: 8px;
    }
    .diff-field { font-size: 11px; color: var(--hint); margin-bottom: 4px; }
    .diff-values { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .diff-old { color: var(--red); text-decoration: line-through; }
    .diff-arrow { color: var(--hint); }
    .diff-new { color: var(--green); font-weight: 700; }

    /* ── Skeleton loader ── */
    .skeleton {
      background: linear-gradient(90deg, var(--bg2) 25%, rgba(0,0,0,.06) 50%, var(--bg2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .sk-block { height: 14px; margin: 6px 0; }
    .sk-title { height: 18px; width: 55%; margin-bottom: 10px; }
    .sk-card { background: var(--bg2); border-radius: var(--radius); padding: 14px; margin-top: 10px; }
    .sk-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.05); gap: 10px; }
    .sk-row:last-child { border-bottom: none; }
    .sk-label { height: 12px; width: 38%; }
    .sk-val   { height: 12px; width: 28%; }

    /* ── Inline validation ── */
    .form-select.invalid, .form-input.invalid {
      border-color: var(--red) !important;
      background: #fff3f3;
    }
    .field-error { font-size: 11px; color: var(--red); padding: 3px 14px 6px; }

    /* ── Progress bar ── */
    .progress-wrap { padding: 14px 0 4px; }
    .progress-label { font-size: 11px; color: var(--hint); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .progress-track { height: 6px; background: var(--bg2); border-radius: 10px; overflow: hidden; }
    .progress-fill  { height: 100%; border-radius: 10px; background: var(--accent); transition: width .4s ease; }
    .stage-dots { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .stage-dot {
      font-size: 10px; padding: 3px 8px; border-radius: 20px;
      background: var(--bg2); color: var(--hint); font-weight: 600;
    }
    .stage-dot.done  { background: #e8f5e9; color: #2e7d32; }
    .stage-dot.active { background: #e3f2fd; color: #1565c0; }

    /* ── Bottom nav ── */
    .tab-bar {
      display: flex;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg);
      border-top: 1px solid var(--bg2);
      padding-bottom: env(safe-area-inset-bottom, 8px);
      z-index: 20;
    }
    .tab-item {
      flex: 1; text-align: center; padding: 10px 0;
      cursor: pointer; font-size: 10px; color: var(--hint);
      transition: color .15s;
    }
    .tab-item.active { color: var(--accent); }
    .tab-icon { font-size: 20px; display: block; margin-bottom: 2px; }

    .page-content { padding-bottom: 68px; }

    /* Recent searches */
    .recent-label { font-size: 11px; color: var(--hint); margin: 14px 0 6px; }
    .recent-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: var(--bg2); border-radius: 20px;
      padding: 5px 12px; font-size: 12px; cursor: pointer;
      color: var(--accent); font-weight: 600;
    }
    .chip:active { opacity: .7; }
  </style>
</head>
<body>

<!-- ── SEARCH SCREEN ── -->
<div id="screen-search" class="screen active page-content">
  <div style="padding: 20px 0 8px;">
    <div style="font-size: 20px; font-weight: 800; margin-bottom: 4px;">SSV Tracker</div>
    <div style="font-size: 13px; color: var(--hint);">Search a site to view or update progress</div>
  </div>

  <div class="search-wrap">
    <div class="search-input-row">
      <input id="search-input" class="search-input" type="text"
        placeholder="Enter Site ID or city…" autocomplete="off" autocorrect="off"/>
      <button class="btn" onclick="handleSearch()">Search</button>
    </div>
    <div id="search-error"></div>
  </div>

  <div id="recent-wrap" style="display:none;">
    <div class="recent-label">Recent</div>
    <div id="recent-chips" class="recent-chips"></div>
  </div>

  <div id="search-results" class="result-list"></div>
</div>

<!-- ── SITE DETAIL SCREEN ── -->
<div id="screen-detail" class="screen page-content">
  <div class="header">
    <button class="back-btn" onclick="showScreen('search')">← Back</button>
    <h1 id="detail-title">Site Detail</h1>
  </div>
  <div id="detail-content" style="padding: 0 16px 16px;"></div>
</div>

<!-- ── DASHBOARD SCREEN ── -->
<div id="screen-dashboard" class="screen page-content">
  <div style="padding: 20px 0 8px;">
    <div style="font-size: 20px; font-weight: 800; margin-bottom: 4px;">Dashboard</div>
    <div style="font-size: 13px; color: var(--hint);">SSV rollout overview</div>
  </div>
  <div id="dashboard-content"></div>
</div>

<!-- ── UPDATE FORM SCREEN ── -->
<div id="screen-form" class="screen page-content">
  <div class="header">
    <button class="back-btn" onclick="showScreen('detail')">← Back</button>
    <h1 id="form-title">Update Site</h1>
  </div>
  <div id="form-content" style="padding: 0 16px 16px;"></div>
</div>

<!-- ── CONFIRM SCREEN ── -->
<div id="screen-confirm" class="screen page-content">
  <div class="header">
    <button class="back-btn" onclick="showScreen('form')">← Edit</button>
    <h1>Confirm Update</h1>
  </div>
  <div style="padding: 0 16px 16px;">
    <div style="font-size: 13px; color: var(--hint); margin: 12px 0 6px;">Changes to be saved:</div>
    <div id="confirm-diff"></div>
    <button class="btn btn-block" id="confirm-submit-btn" onclick="submitUpdate()" style="margin-top:20px;">
      ✅ Confirm &amp; Save
    </button>
    <button class="btn btn-outline btn-block" onclick="showScreen('form')" style="margin-top:8px;">
      ← Go Back &amp; Edit
    </button>
    <div id="confirm-error"></div>
  </div>
</div>

<!-- ── TAB BAR ── -->
<nav class="tab-bar">
  <div class="tab-item active" id="tab-search" onclick="switchTab('search')">
    <span class="tab-icon">🔍</span>Search
  </div>
  <div class="tab-item" id="tab-dashboard" onclick="switchTab('dashboard')">
    <span class="tab-icon">📊</span>Dashboard
  </div>
</nav>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxj44gOO6BrpAGWJ4YSmI2USsOkUPE4LBxE_1B1LQJR8HxJDSVkzYaKZd1JJMFCVO4I/exec';

// ── TELEGRAM INIT ────────────────────────────────────────────────────────────
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

function getInitData() {
  return tg ? tg.initData : '';
}

// ── API ──────────────────────────────────────────────────────────────────────
function apiFetch(action, params) {
  var url = GAS_URL + '?action=' + action;
  Object.keys(params || {}).forEach(function(k) {
    url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  });
  return fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.success) throw new Error(data.error || 'API error');
      return data;
    });
}

// ── SCREEN NAVIGATION ────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById('screen-' + id).classList.add('active');
  // Telegram MainButton: show only on confirm screen
  if (tg && tg.MainButton) {
    if (id === 'confirm') {
      tg.MainButton.setText('✅ Confirm & Save');
      tg.MainButton.show();
    } else {
      tg.MainButton.hide();
    }
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'dashboard') {
    showScreen('dashboard');
    loadDashboard();
  } else {
    showScreen('search');
  }
}

// ── RECENT SITES (localStorage) ──────────────────────────────────────────────
function getRecent() {
  try { return JSON.parse(localStorage.getItem('ssv_recent') || '[]'); } catch(e) { return []; }
}
function saveRecent(siteId) {
  var list = getRecent().filter(function(id) { return id !== siteId; });
  list.unshift(siteId);
  localStorage.setItem('ssv_recent', JSON.stringify(list.slice(0, 5)));
  renderRecent();
}
function renderRecent() {
  var list = getRecent();
  var wrap = document.getElementById('recent-wrap');
  var chips = document.getElementById('recent-chips');
  if (!list.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  chips.innerHTML = list.map(function(id) {
    return '<span class="chip" onclick="loadSite(\'' + escHtml(id) + '\')">' + escHtml(id) + '</span>';
  }).join('');
}

// ── SEARCH ───────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleSearch();
});

function handleSearch() {
  var q = document.getElementById('search-input').value.trim();
  if (!q) return;
  var container = document.getElementById('search-results');
  var errEl = document.getElementById('search-error');
  errEl.innerHTML = '';
  container.innerHTML = loadingHtml('Searching…');

  apiFetch('searchSite', { query: q })
    .then(function(data) {
      var results = data.results || [];
      if (!results.length) {
        container.innerHTML = '<div class="empty-msg">No sites found for "' + escHtml(q) + '"</div>';
        return;
      }
      container.innerHTML = results.map(function(r) {
        return '<div class="result-item" onclick="loadSite(\'' + escHtml(r.siteId) + '\')">' +
          '<div class="site-id">' + escHtml(r.siteId) + '</div>' +
          '<div class="meta">' + [r.team, r.region, r.city, r.scopeType].filter(Boolean).map(escHtml).join(' · ') + '</div>' +
        '</div>';
      }).join('');
    })
    .catch(function(err) {
      container.innerHTML = '';
      errEl.innerHTML = '<div class="error-msg">⚠ ' + escHtml(err.message) + '</div>';
    });
}

// ── SITE DETAIL ───────────────────────────────────────────────────────────────
function loadSite(siteId) {
  saveRecent(siteId);
  showScreen('detail');
  document.getElementById('detail-title').textContent = siteId;
  document.getElementById('detail-content').innerHTML = skeletonDetailHtml();

  apiFetch('getSiteData', { siteId: siteId })
    .then(function(data) {
      currentSiteId   = siteId;
      currentSiteData = data.site;
      renderSiteDetail(data.site);
    })
    .catch(function(err) {
      document.getElementById('detail-content').innerHTML =
        '<div class="error-msg">⚠ ' + escHtml(err.message) + '</div>';
    });
}

function renderSiteDetail(s) {
  var html = '';

  // Progress bar
  html += renderProgressBar(s);

  // Site info
  html += section('Site Info', [
    ['Site ID',    s['Site ID']],
    ['Team',       s['Team']],
    ['Region',     s['Region']],
    ['City',       s['City']],
    ['Scope Type', s['Scope Type']],
    ['Batch',      s['Batch']]
  ]);

  // Execution
  html += section('Execution', [
    ['On-Air Plan',   fmtDate(s['On-Air Plan'])],
    ['On-Air Actual', fmtDate(s['On-Air Actual'])],
    ['Site On-Air',   s['Site On-Air'], 'badge']
  ]);

  // Testing
  html += section('Testing', [
    ['Test Date Planned', fmtDate(s['Test Date Planned'])],
    ['Test Date Actual',  fmtDate(s['Test Date Actual'])],
    ['Test Finished',     s['Test Finished'], 'badge']
  ]);

  // Analysis
  html += section('Analysis', [
    ['Analysis Planned',  fmtDate(s['Analysis Planned'])],
    ['Analysis Actual',   fmtDate(s['Analysis Actual'])],
    ['Analysis Finished', s['Analysis Finished'], 'badge']
  ]);

  // Change Control
  html += section('Change Control', [
    ['Intervention Req.',   s['Intervention Req.'], 'badge'],
    ['Change Date Planned', fmtDate(s['Change Date Planned'])],
    ['Change Date Actual',  fmtDate(s['Change Date Actual'])],
    ['Change Completed',    s['Change Completed'], 'badge']
  ]);

  // Final Acceptance
  html += section('Final Acceptance', [
    ['SSV Passed', s['SSV Passed'], 'badge'],
    ['Remarks',    s['Remarks']]
  ]);

  html += '<button class="btn btn-block" style="margin-top:16px;" onclick="openUpdateForm()">' +
    '✏️ Update Progress</button>';

  document.getElementById('detail-content').innerHTML = html;
}

function section(title, fields) {
  var rows = fields.map(function(f) {
    var label = f[0], val = f[1] || '', type = f[2];
    var display = type === 'badge' ? badgeHtml(val) : '<span class="field-value">' + escHtml(val || '—') + '</span>';
    return '<div class="field-row"><span class="field-label">' + escHtml(label) + '</span>' + display + '</div>';
  }).join('');
  return '<div class="section-block"><div class="section-title">' + escHtml(title) + '</div>' + rows + '</div>';
}

function badgeHtml(val) {
  var v = String(val || '').toLowerCase();
  var cls = v === 'yes' ? 'badge-yes' : v === 'no' ? 'badge-no' : 'badge-blank';
  return '<span class="badge ' + cls + '">' + escHtml(val || '—') + '</span>';
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
var dashLoaded = false;
function loadDashboard() {
  if (dashLoaded) return;
  var el = document.getElementById('dashboard-content');
  el.innerHTML = skeletonDashHtml();

  apiFetch('getDashboardSummary', {})
    .then(function(data) {
      dashLoaded = true;
      renderDashboard(data.summary);
    })
    .catch(function(err) {
      el.innerHTML = '<div class="error-msg">⚠ ' + escHtml(err.message) + '</div>';
    });
}

function renderDashboard(s) {
  var html =
    '<div class="dash-grid">' +
      statCard(s.total,               'Total Sites',       'blue')   +
      statCard(s.onAir,               'On-Air',            'green')  +
      statCard(s.testDone,            'Tests Done',        'blue')   +
      statCard(s.ssvPassed,           'SSV Passed',        'green')  +
      statCard(s.interventionRequired,'Interventions',     'orange') +
      statCard(s.pending,             'Pending SSV',       'red')    +
    '</div>';
  document.getElementById('dashboard-content').innerHTML = html;
}

function statCard(num, label, color) {
  return '<div class="stat-card ' + color + '">' +
    '<div class="num">' + (num || 0) + '</div>' +
    '<div class="label">' + label + '</div>' +
  '</div>';
}

// ── UTILITIES ────────────────────────────────────────────────────────────────
function loadingHtml(msg) {
  return '<div class="loading"><div class="spinner"></div>' + escHtml(msg) + '</div>';
}

function skeletonDetailHtml() {
  var card = function(rows) {
    var r = '';
    for (var i = 0; i < rows; i++) {
      r += '<div class="sk-row"><div class="skeleton sk-block sk-label"></div><div class="skeleton sk-block sk-val"></div></div>';
    }
    return '<div class="sk-card">' + r + '</div>';
  };
  return '<div style="padding:0 0 16px">' +
    '<div class="skeleton sk-block sk-title" style="margin-top:12px"></div>' +
    card(3) + card(3) + card(3) + card(4) + card(2) +
  '</div>';
}

function skeletonDashHtml() {
  var cell = '<div style="background:var(--bg2);border-radius:var(--radius);padding:20px 12px;text-align:center">' +
    '<div class="skeleton sk-block" style="height:28px;width:50%;margin:0 auto 8px"></div>' +
    '<div class="skeleton sk-block" style="height:10px;width:70%;margin:0 auto"></div></div>';
  return '<div class="dash-grid" style="margin-top:16px">' + cell+cell+cell+cell+cell+cell + '</div>';
}
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Format ISO date strings to DD-MMM-YY; pass through anything else
function fmtDate(val) {
  if (!val) return '—';
  var d = new Date(val);
  if (isNaN(d.getTime())) return val;
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var dd = String(d.getDate()).padStart(2,'0');
  var mm = months[d.getMonth()];
  var yy = String(d.getFullYear()).slice(-2);
  return dd + '-' + mm + '-' + yy;
}

// ── PROGRESS BAR ─────────────────────────────────────────────────────────────

var STAGES = [
  { label: 'On-Air',    key: 'Site On-Air' },
  { label: 'Tested',    key: 'Test Finished' },
  { label: 'Analysed',  key: 'Analysis Finished' },
  { label: 'Changed',   key: 'Change Completed' },
  { label: 'SSV Pass',  key: 'SSV Passed' }
];

function renderProgressBar(s) {
  var done = 0;
  var activeIdx = -1;
  STAGES.forEach(function(st, i) {
    if (String(s[st.key] || '').toLowerCase() === 'yes') { done = i + 1; }
  });
  activeIdx = done < STAGES.length ? done : STAGES.length - 1;
  var pct = Math.round((done / STAGES.length) * 100);

  var dots = STAGES.map(function(st, i) {
    var cls = i < done ? 'done' : (i === activeIdx && done < STAGES.length ? 'active' : '');
    return '<span class="stage-dot ' + cls + '">' + (i < done ? '✓ ' : '') + escHtml(st.label) + '</span>';
  }).join('');

  return '<div class="progress-wrap">' +
    '<div class="progress-label"><span>SSV Progress</span><span>' + done + ' / ' + STAGES.length + ' stages</span></div>' +
    '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="stage-dots">' + dots + '</div>' +
  '</div>';
}

// ── UPDATE FORM ──────────────────────────────────────────────────────────────

var currentSiteId   = null; // Site ID being edited
var currentSiteData = null; // Full site row (read-only snapshot)
var pendingFields   = {};   // Staged changes { fieldName: newValue }

var FORM_SECTIONS = [
  {
    title: 'Section A — Execution',
    fields: [
      { key: 'On-Air Actual',  label: 'On-Air Actual',  type: 'date' },
      { key: 'Site On-Air',    label: 'Site On-Air',     type: 'yesno' }
    ]
  },
  {
    title: 'Section B — Testing',
    id: 'section-testing',
    fields: [
      { key: 'Test Date Actual', label: 'Test Date Actual', type: 'date' },
      { key: 'Test Finished',    label: 'Test Finished',    type: 'yesno' }
    ]
  },
  {
    title: 'Section C — Analysis',
    id: 'section-analysis',
    fields: [
      { key: 'Analysis Actual',   label: 'Analysis Actual',   type: 'date' },
      { key: 'Analysis Finished', label: 'Analysis Finished', type: 'yesno' }
    ]
  },
  {
    title: 'Section D — Change Control',
    id: 'section-change',
    fields: [
      { key: 'Intervention Req.',     label: 'Intervention Req.',     type: 'yesno' },
      { key: 'Change Date Actual',    label: 'Change Date Actual',    type: 'date', id: 'change-date-row' },
      { key: 'Change Completed',      label: 'Change Completed',      type: 'yesno', id: 'change-completed-row' }
    ]
  },
  {
    title: 'Section E — Final Acceptance',
    fields: [
      { key: 'SSV Passed', label: 'SSV Passed', type: 'yesno' },
      { key: 'Remarks',    label: 'Remarks',    type: 'text' }
    ]
  }
];

function openUpdateForm() {
  if (!currentSiteId || !currentSiteData) return;
  pendingFields = {};
  document.getElementById('form-title').textContent = 'Update ' + currentSiteId;
  renderForm();
  showScreen('form');
}

function renderForm() {
  var s = currentSiteData;
  var html = '';

  FORM_SECTIONS.forEach(function(section) {
    html += '<div class="form-section"' + (section.id ? ' id="' + section.id + '"' : '') + '>';
    html += '<div class="form-section-title">' + escHtml(section.title) + '</div>';
    html += '<div class="form-group">';
    section.fields.forEach(function(f) {
      html += renderFormField(f, s[f.key] || '');
    });
    html += '</div></div>';
  });

  html += '<button class="btn btn-block" style="margin-top:20px;" onclick="goToConfirm()">Review Changes →</button>';
  document.getElementById('form-content').innerHTML = html;

  applySmartLogic();
}

function renderFormField(f, currentVal) {
  var rowId  = f.id ? ' id="' + f.id + '"' : '';
  var inputId = 'field-' + f.key.replace(/\s+/g, '-');
  var input   = '';

  if (f.type === 'yesno') {
    input = '<select class="form-select" id="' + inputId + '" onchange="onFieldChange(\'' + f.key + '\',this.value)">' +
      '<option value="">—</option>' +
      '<option value="Yes"' + (currentVal === 'Yes' ? ' selected' : '') + '>Yes</option>' +
      '<option value="No"'  + (currentVal === 'No'  ? ' selected' : '') + '>No</option>' +
      '</select>';
  } else if (f.type === 'date') {
    input = '<input class="form-input" id="' + inputId + '" type="text" placeholder="DD-MMM-YY"' +
      ' value="' + escHtml(currentVal) + '"' +
      ' onchange="onFieldChange(\'' + f.key + '\',this.value)"' +
      ' oninput="onFieldChange(\'' + f.key + '\',this.value)"/>';
  } else {
    input = '<input class="form-input" id="' + inputId + '" type="text" placeholder="Optional…"' +
      ' value="' + escHtml(currentVal) + '"' +
      ' onchange="onFieldChange(\'' + f.key + '\',this.value)"' +
      ' oninput="onFieldChange(\'' + f.key + '\',this.value)"/>';
  }

  return '<div class="form-row"' + rowId + '><label>' + escHtml(f.label) + '</label>' + input + '</div>';
}

function onFieldChange(key, value) {
  pendingFields[key] = value.trim();
}

// Smart logic: conditional field visibility
function applySmartLogic() {
  var siteOnAir   = document.getElementById('field-Site-On-Air');
  var testSection = document.getElementById('section-testing');
  var anaSection  = document.getElementById('section-analysis');
  var intervention = document.getElementById('field-Intervention-Req.');
  var changeDateRow = document.getElementById('change-date-row');
  var changeCompRow = document.getElementById('change-completed-row');

  function update() {
    var onAirVal = siteOnAir ? siteOnAir.value : '';
    var interVal = intervention ? intervention.value : '';

    if (testSection) testSection.style.opacity = (onAirVal === 'No') ? '.4' : '1';
    if (anaSection)  anaSection.style.opacity  = (onAirVal === 'No') ? '.4' : '1';

    var showChange = interVal === 'Yes';
    if (changeDateRow) changeDateRow.style.display = showChange ? '' : 'none';
    if (changeCompRow) changeCompRow.style.display = showChange ? '' : 'none';
  }

  if (siteOnAir)    siteOnAir.addEventListener('change', update);
  if (intervention) intervention.addEventListener('change', update);
  update();
}

// ── CONFIRM SCREEN ────────────────────────────────────────────────────────────

function goToConfirm() {
  // Clear previous validation
  document.querySelectorAll('.form-select.invalid, .form-input.invalid').forEach(function(el) {
    el.classList.remove('invalid');
  });
  document.querySelectorAll('.field-error').forEach(function(el) { el.remove(); });

  // Validate date fields
  var firstInvalid = null;
  var dateFields = ['On-Air Actual', 'Test Date Actual', 'Analysis Actual', 'Change Date Actual'];
  dateFields.forEach(function(key) {
    var inputId = 'field-' + key.replace(/\s+/g, '-');
    var el = document.getElementById(inputId);
    if (!el || !el.value.trim()) return;
    var v = el.value.trim();
    // Accept DD-MMM-YY, YYYY-MM-DD, or empty
    var ok = /^\d{2}-[A-Za-z]{3}-\d{2}$/.test(v) || /^\d{4}-\d{2}-\d{2}/.test(v);
    if (!ok) {
      el.classList.add('invalid');
      var err = document.createElement('div');
      err.className = 'field-error';
      err.textContent = 'Use format DD-MMM-YY (e.g. 13-Jun-26)';
      el.parentNode.parentNode.appendChild(err);
      if (!firstInvalid) firstInvalid = el;
    }
  });

  if (firstInvalid) {
    firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    return;
  }

  // Filter to only actually-changed values
  var changed = {};
  Object.keys(pendingFields).forEach(function(key) {
    var newVal = pendingFields[key];
    var oldVal = String(currentSiteData[key] || '').trim();
    if (newVal !== oldVal && newVal !== '') changed[key] = newVal;
  });

  if (!Object.keys(changed).length) {
    alert('No changes made yet.');
    return;
  }

  pendingFields = changed; // keep only real changes

  var html = Object.keys(changed).map(function(key) {
    var oldVal = String(currentSiteData[key] || '—');
    var newVal = changed[key] || '—';
    return '<div class="diff-row">' +
      '<div class="diff-field">' + escHtml(key) + '</div>' +
      '<div class="diff-values">' +
        '<span class="diff-old">'   + escHtml(oldVal) + '</span>' +
        '<span class="diff-arrow">→</span>' +
        '<span class="diff-new">'   + escHtml(newVal) + '</span>' +
      '</div>' +
    '</div>';
  }).join('');

  document.getElementById('confirm-diff').innerHTML = html;
  document.getElementById('confirm-error').innerHTML = '';
  document.getElementById('confirm-submit-btn').disabled = false;
  showScreen('confirm');
}

// ── SUBMIT ────────────────────────────────────────────────────────────────────

function submitUpdate() {
  var btn = document.getElementById('confirm-submit-btn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  if (tg && tg.MainButton) { tg.MainButton.showProgress(false); tg.MainButton.disable(); }

  var payload = {
    action:   'updateSiteData',
    siteId:   currentSiteId,
    fields:   pendingFields,
    initData: getInitData()
  };

  fetch(GAS_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(payload)
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (!data.success) throw new Error(data.error || 'Update failed');

    // Haptic feedback
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

    // Refresh cached site data with new values
    Object.keys(pendingFields).forEach(function(k) {
      currentSiteData[k] = pendingFields[k];
    });
    pendingFields = {};

    if (tg && tg.MainButton) { tg.MainButton.hideProgress(); tg.MainButton.hide(); }
    showSuccessBanner(data.result.message);
    showScreen('detail');
    renderSiteDetail(currentSiteData);
  })
  .catch(function(err) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    btn.disabled = false;
    btn.textContent = '✅ Confirm & Save';
    if (tg && tg.MainButton) { tg.MainButton.hideProgress(); tg.MainButton.enable(); }
    document.getElementById('confirm-error').innerHTML =
      '<div class="error-msg" style="margin-top:12px;">⚠ ' + escHtml(err.message) + '</div>';
  });
}

function showSuccessBanner(msg) {
  var banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:16px;left:16px;right:16px;background:#e8f5e9;' +
    'border:1px solid #a5d6a7;border-radius:10px;padding:12px 16px;font-size:13px;' +
    'color:#2e7d32;font-weight:600;z-index:99;text-align:center;';
  banner.textContent = '✅ ' + msg;
  document.body.appendChild(banner);
  setTimeout(function() { banner.remove(); }, 3000);
}

// ── INIT ─────────────────────────────────────────────────────────────────────

// Wire Telegram MainButton
if (tg && tg.MainButton) {
  tg.MainButton.onClick(submitUpdate);
}

// Prefetch dropdown options on load (cache in memory)
var cachedOptions = null;
function getOptions() {
  if (cachedOptions) return Promise.resolve(cachedOptions);
  return apiFetch('getDropdownOptions', {}).then(function(d) {
    cachedOptions = d.options;
    return cachedOptions;
  }).catch(function() {
    cachedOptions = { yesNo: ['Yes','No'], ssvPassed: ['Yes','No','Pending'] };
    return cachedOptions;
  });
}
getOptions(); // warm cache immediately

renderRecent();

// Warn if GAS_URL not set
if (!GAS_URL) {
  document.getElementById('search-error').innerHTML =
    '<div class="error-msg">⚙ GAS_URL not configured in index.html</div>';
}
</script>
